[project]
name = "agente-sgsst"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Julian Correa", email = "juliancorrea1630@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "google-api-python-client>=2.200.0",
    "google-auth-oauthlib>=1.4.1",
    "google-generativeai>=0.8.6",
    "openai>=3.8.0",
    "openpyxl>=3.1.5",
    "pypdf>=5.2.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.0.0",
    "requests>=2.34.2",
    "streamlit>=1.64.0",
]

[project.scripts]
agente-sgsst = "agente_sgsst.main:main"

[dependency-groups]
dev = [
    "pytest>=9.0",
    "ruff>=0.9",
    "xlrd>=2.0.2",
]

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "agente_sgsst"
module-root = "src"

[tool.pytest.ini_options]
pythonpath = [".", "src"]

[tool.ruff]
target-version = "py311"
line-length = 110
exclude = [".agents"]

[tool.ruff.lint]
select = ["E", "F"]

